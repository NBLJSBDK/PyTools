# 盲打训练默认配置
# 程序退出时自动保存当前训练模式、次数、输入法和自动提交设置。

[默认设置]
# 默认训练模式：顺序学习 / 乱序巩固 / 单次测速
default_mode = 顺序学习

# 默认每个词练习次数，范围 1-99。
# 单次测速模式不使用此项。
default_times = 7

# 默认输入法，仅用于成绩记录，不会改变程序的答案判定。
default_input_method = 自然码双拼

# 默认是否自动提交：1=勾选，0=不勾选。
default_auto_submit = 1

[输入法列表]
# 右侧填 1 表示显示，填 0 表示隐藏。
# 可以在这里继续添加自己的输入法：我的输入法 = 1
全拼 = 1
英文模式 = 1
雾凇拼音 = 1
中文九键 = 1
自然码双拼 = 1
智能ABC双拼 = 1
微软双拼 = 1
搜狗双拼 = 1
小鹤双拼 = 1
紫光双拼 = 1
拼音加加双拼 = 1
